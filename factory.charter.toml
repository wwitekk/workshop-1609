# Human-owned policy for the Software (re)-Factory.
# Agents may read this file but must never modify it.
schema_version = 1
approved = true
approved_policy_sha256 = "3f34af09486bace0432162d7580d07c133bb9febc6bdaf661403e32d2639c5fe"

[policy]
consequence_tier = "shared"
merge_authority = "human"
existing_tests = "review"
planning_approvals = ["product_review", "alignment"]
gate_level = "full"
stop_conditions = ["A required gate is missing, skipped, or fails.", "A proposed change touches a never-modify path.", "The human review queue reaches its configured capacity.", "The requested work exceeds the approved Ticket or diff budget.", "The Charter is silent about a load-bearing change."]

[limits]
max_retries = 2
max_diff_lines = 1200
max_awaiting_human_review = 3
max_blocked_for_human = 2
oldest_review_hours = 24

[paths]
load_bearing = ["factory.charter.toml", "factory.project.toml", ".github/workflows", "migrations", "auth", "security"]
editable = ["demo-app"]
never_modify = ["factory.charter.toml", ".env", ".secrets"]
requires_human_approval = ["factory.project.toml", "AGENTS.md", "CLAUDE.md", ".agents", ".codex", ".github/workflows", "migrations", "auth", "security", "demo-app/tests", "demo-app/static/tests"]
